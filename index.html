<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Psychology Tools</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

  <header>
    <h1>Psychology Tools</h1>

    <p>
      Privacy-first assessment tools
    </p>
  </header>

  <section class="card">

    <h2>PHQ-9</h2>

    <input
      id="score"
      type="number"
      min="0"
      max="27"
      placeholder="คะแนน 0–27"
    >

    <button onclick="calculate()">
      ประเมิน
    </button>

    <button onclick="window.print()">
      Print
    </button>

    <div id="result"></div>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
